# APK Android (jalon 6) : construit à chaque push sur main, signé avec la clé gardée dans les secrets du dépôt.
name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scénarios joués sur l'émulateur (liste JSON)"
        default: '["principal","immobile","fini"]'
# un push plus récent remplace la vérification en cours (chaque run émulateur dure ~30 min)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  # empreinte du certificat du magasin de clés plein-et-trajet-release.p12 (calculée au VPS, docs/pipeline/m6-journal.md)
  EMPREINTE_SHA256: b3a3b7b2998e2d804a258491f60920417127dc01a32da2f7e2df794909314c25
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Clé de signature
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
      - run: ./gradlew assembleRelease assembleDebug --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Clé de signature effacée du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      # signature (empreinte = celle du magasin de clés) et manifeste fusionné (permissions, service de localisation)
      - name: Contrôles de l'APK (apksigner, aapt2)
        run: |
          cd android/app/build/outputs/apk
          python3 "$GITHUB_WORKSPACE/tests/android/controle-apk.py" release/app-release.apk controles-apk.txt
          sha256sum release/app-release.apk | tee -a controles-apk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plein-et-trajet-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/controles-apk.txt
            android/app/build/outputs/apk/controles-apk-manifeste.txt
  # instrumentation sur un téléphone simulé (tests/android/m6-emulateur.mjs) : un job par scénario, en parallèle
  emulateur:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event.inputs.scenarios || '["principal","immobile","fini"]') }}
    steps:
      # l'émulateur API 34 réserve 7,2 Go de données ; certains runners n'en laissent que 7,1 (run 39659349314 :
      # « FATAL Not enough space to create userdata partition ») : outils inutiles ici retirés, partition ramenée à 4 Go
      - name: Place disque
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h / | tail -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plein-et-trajet-apk
      # le démarrage de l'émulateur dépasse parfois 15 min sur les runners (run 39655982353, job immobile) : une seconde chance,
      # seulement si le scénario n'a pas commencé (fichier sortie-m6/demarre absent)
      - id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # les runners ubuntu-latest ont 4 cœurs : avec 2 (défaut) le démarrage dépassait parfois 10 min
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disk-size: 4096M
          # 90 s de calme avant le scénario : juste après le démarrage, les services Google (gms.persistent) tombent en ANR et le
          # système tue l'appli qui dépend de leur fournisseur de polices (run 39664532821, job immobile, logcat :
          # « Killing …pleinettrajet (adj 0): depends on provider …FontsProvider in dying proc com.google.android.gms.persistent »).
          # round 2 (audit r1, MEDIUM 4) : tout le scénario tourne sur l'APK de RELEASE signé, celui qu'on publie ; sa WebView est
          # rendue inspectable par `am start … --ez pt_inspecter true`. `adb root` (image google_apis) lit le journal du service
          # et tue le processus. Le scénario principal installe sans -g : les dialogues d'autorisation sont testés.
          script: |
            adb root; sleep 5; adb wait-for-device; adb shell id
            mkdir -p sortie-m6 && touch sortie-m6/demarre
            if [ "${{ matrix.scenario }}" = principal ]; then adb install -r -g release/app-release.apk && adb shell monkey -p cloud.ingevision.pleinettrajet -c android.intent.category.LAUNCHER 1 && sleep 20 && adb exec-out screencap -p > sortie-m6/V-1.3-A01-apk-release.png && adb uninstall cloud.ingevision.pleinettrajet; fi
            if [ "${{ matrix.scenario }}" = principal ]; then adb install -r release/app-release.apk; else adb install -r -g release/app-release.apk; fi
            sleep 90
            node --experimental-strip-types --no-warnings tests/android/m6-emulateur.mjs ${{ matrix.scenario }} sortie-m6
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - id: emu2
        if: steps.emu1.outcome == 'failure' && hashFiles('sortie-m6/demarre') == ''
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # les runners ubuntu-latest ont 4 cœurs : avec 2 (défaut) le démarrage dépassait parfois 10 min
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disk-size: 4096M
          # 90 s de calme avant le scénario : juste après le démarrage, les services Google (gms.persistent) tombent en ANR et le
          # système tue l'appli qui dépend de leur fournisseur de polices (run 39664532821, job immobile, logcat :
          # « Killing …pleinettrajet (adj 0): depends on provider …FontsProvider in dying proc com.google.android.gms.persistent »).
          # round 2 (audit r1, MEDIUM 4) : tout le scénario tourne sur l'APK de RELEASE signé, celui qu'on publie ; sa WebView est
          # rendue inspectable par `am start … --ez pt_inspecter true`. `adb root` (image google_apis) lit le journal du service
          # et tue le processus. Le scénario principal installe sans -g : les dialogues d'autorisation sont testés.
          script: |
            adb root; sleep 5; adb wait-for-device; adb shell id
            mkdir -p sortie-m6 && touch sortie-m6/demarre
            if [ "${{ matrix.scenario }}" = principal ]; then adb install -r -g release/app-release.apk && adb shell monkey -p cloud.ingevision.pleinettrajet -c android.intent.category.LAUNCHER 1 && sleep 20 && adb exec-out screencap -p > sortie-m6/V-1.3-A01-apk-release.png && adb uninstall cloud.ingevision.pleinettrajet; fi
            if [ "${{ matrix.scenario }}" = principal ]; then adb install -r release/app-release.apk; else adb install -r -g release/app-release.apk; fi
            sleep 90
            node --experimental-strip-types --no-warnings tests/android/m6-emulateur.mjs ${{ matrix.scenario }} sortie-m6
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-m6-${{ matrix.scenario }}
          path: sortie-m6/
      # le premier essai a joué le scénario et l'a perdu : le job échoue (continue-on-error ne vaut que pour le démarrage)
      - name: Verdict du scénario
        if: steps.emu1.outcome == 'failure' && steps.emu2.outcome == 'skipped'
        run: cat sortie-m6/verdicts-*.txt 2>/dev/null; exit 1
