<h1>Plein &amp; Trajet — architecture système</h1>
<p>Pile standard : React + Vite sur Vercel, Supabase (Postgres/PostGIS, Auth anonyme, Edge Functions, pg_cron, RLS). Sources publiques sans clé : prix officiels, ADEME, IGN Géoplateforme.</p>
